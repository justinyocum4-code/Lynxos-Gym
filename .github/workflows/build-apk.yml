name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name (e.g. 5.9)'
        required: false
        type: string
        default: ''
      version_code:
        description: 'Version code - must be a whole number bigger than last time'
        required: false
        type: string
        default: ''
      release_notes:
        description: 'What changed in this version (shown in the store)'
        required: false
        type: string
        default: ''

jobs:
  build:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    env:
      APP_VERSION_NAME: ${{ inputs.version_name || '5.9' }}
      APP_VERSION_CODE: ${{ inputs.version_code || '24' }}
      APP_RELEASE_NOTES: ${{ inputs.release_notes || 'Update' }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME"
          if ! command -v sdkmanager >/dev/null 2>&1; then
            export PATH="$PATH:$ANDROID_HOME/cmdline-tools/latest/bin"
          fi
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Scaffold Android project
        run: |
          echo "=== Files in repo ==="
          ls -la
          HTML_FILE=""
          for candidate in ./index.html ./*.html; do
            if [ -f "$candidate" ] && grep -q 'id="app-info"' "$candidate"; then
              HTML_FILE="$candidate"
              break
            fi
          done
          if [ -z "$HTML_FILE" ]; then
            echo "ERROR: no app HTML file found in the repository root."
            echo "Upload the newest index.html (Add file > Upload files), then re-run this workflow."
            exit 1
          fi
          echo "Using $HTML_FILE as the app page."

          mkdir -p app/src/main/java/com/workoutapp/app app/src/main/assets/www

          cp "$HTML_FILE" app/src/main/assets/www/index.html

          # Fire TV (Leanback) banner so the app shows in the TV app row.
          mkdir -p app/src/main/res/drawable
          if [ -f tv_banner.png ]; then
            cp tv_banner.png app/src/main/res/drawable/tv_banner.png
            echo "TV banner installed."
          else
            echo "WARNING: tv_banner.png not found in repo; Leanback banner skipped."
          fi

          # Vendored Health Connect protobuf JARs (Maven resolution of these
          # two modules fails on the CI runner; they are shipped as files).
          mkdir -p app/libs
          if ls libs/*.jar >/dev/null 2>&1; then
            cp libs/*.jar app/libs/
            echo "Vendored JARs: $(ls app/libs/)"
          else
            echo "WARNING: libs/*.jar not found in repo; Health Connect build will fail."
          fi

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "LynxosGym"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.9.1' apply false
              id 'org.jetbrains.kotlin.android' version '2.0.21' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.workoutapp.app'
              compileSdk 36
              defaultConfig {
                  applicationId 'com.workoutapp.app'
                  minSdk 26
                  targetSdk 34
                  versionCode __APP_VERSION_CODE__
                  versionName '__APP_VERSION_NAME__'
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }
          dependencies {
              implementation("androidx.health.connect:connect-client:1.1.0") {
                  exclude group: "androidx.health.connect", module: "connect-client-proto"
                  exclude group: "androidx.health.connect", module: "connect-client-external-protobuf"
              }
              // Vendored (see copy step above): these two modules fail Maven
              // resolution on the CI runner, so they are bundled as files.
              implementation(files("libs/connect-client-proto-1.1.0.jar"))
              implementation(files("libs/connect-client-external-protobuf-1.1.0.jar"))
              implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1"
          }
          EOF
          sed -i "s/__APP_VERSION_CODE__/$APP_VERSION_CODE/g; s/__APP_VERSION_NAME__/$APP_VERSION_NAME/g" app/build.gradle

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.health.READ_EXERCISE"/>
              <uses-permission android:name="android.permission.health.WRITE_EXERCISE"/>
              <queries>
                  <package android:name="com.google.android.apps.healthdata" />
                  <intent>
                      <action android:name="androidx.health.ACTION_REQUEST_PERMISSIONS" />
                  </intent>
              </queries>
              <!-- Fire TV: the app works with a D-pad remote, no touchscreen needed. -->
              <uses-feature android:name="android.hardware.touchscreen" android:required="false"/>
              <uses-feature android:name="android.software.leanback" android:required="false"/>
              <application
                  android:label="Lynxos Gym"
                  android:banner="@drawable/tv_banner"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity
                      android:name="com.workoutapp.app.MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                      <!-- Google sign-in: Supabase redirects here after browser approval. -->
                      <intent-filter>
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.BROWSABLE" />
                          <data android:scheme="com.workoutapp.app" android:host="auth-callback" />
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.intent.action.VIEW_PERMISSION_USAGE" />
                          <category android:name="android.intent.category.HEALTH_PERMISSIONS" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/workoutapp/app/MainActivity.java <<'EOF'
          package com.workoutapp.app;

          import android.app.Activity;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import android.speech.tts.TextToSpeech;
          import android.webkit.JavascriptInterface;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Toast;
          import java.util.Locale;

          public class MainActivity extends Activity {
              private WebView webView;
              private ValueCallback<Uri[]> filePathCallback;
              private static final int FILE_CHOOSER_REQUEST = 1001;
              private TextToSpeech tts;
              private boolean ttsReady = false;
              private String pendingTts = null;
              private LynxosHealth lynxosHealth;
              private boolean pageLoaded = false;
              private String pendingAuthUrl = null;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  webView = new WebView(this);
                  webView.getSettings().setJavaScriptEnabled(true);
                  webView.getSettings().setDomStorageEnabled(true);
                  webView.getSettings().setAllowFileAccess(true);
                  // Fire TV: take focus so the D-pad remote drives the page immediately.
                  webView.setFocusable(true);
                  webView.setFocusableInTouchMode(true);
                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public void onPageFinished(WebView view, String url) {
                          super.onPageFinished(view, url);
                          pageLoaded = true;
                          if (pendingAuthUrl != null) {
                              String authUrl = pendingAuthUrl;
                              pendingAuthUrl = null;
                              deliverAuthUrl(authUrl);
                          }
                      }
                  });
                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public boolean onShowFileChooser(WebView view, ValueCallback<Uri[]> callback, FileChooserParams params) {
                          if (filePathCallback != null) {
                              filePathCallback.onReceiveValue(null);
                          }
                          filePathCallback = callback;
                          Intent intent = new Intent(Intent.ACTION_GET_CONTENT);
                          intent.addCategory(Intent.CATEGORY_OPENABLE);
                          intent.setType("image/*");
                          try {
                              startActivityForResult(Intent.createChooser(intent, "Choose profile picture"), FILE_CHOOSER_REQUEST);
                          } catch (Exception e) {
                              // No gallery/file app on this device (e.g. Fire TV): bail out cleanly.
                              if (filePathCallback != null) {
                                  filePathCallback.onReceiveValue(null);
                                  filePathCallback = null;
                              }
                          }
                          return true;
                      }
                  });
                  webView.addJavascriptInterface(new Object() {
                      @JavascriptInterface
                      public void setItem(String key, String value) {
                          try {
                              getSharedPreferences("lynxos_gym", MODE_PRIVATE).edit().putString(key, value).commit();
                          } catch (Exception ignored) {}
                      }
                      @JavascriptInterface
                      public String getItem(String key) {
                          try {
                              return getSharedPreferences("lynxos_gym", MODE_PRIVATE).getString(key, null);
                          } catch (Exception e) {
                              return null;
                          }
                      }
                      @JavascriptInterface
                      public void removeItem(String key) {
                          try {
                              getSharedPreferences("lynxos_gym", MODE_PRIVATE).edit().remove(key).commit();
                          } catch (Exception ignored) {}
                      }
                  }, "LynxosStore");
                  tts = new TextToSpeech(this, new TextToSpeech.OnInitListener() {
                      @Override
                      public void onInit(int status) {
                          if (status == TextToSpeech.SUCCESS) {
                              try {
                                  int result = tts.setLanguage(Locale.US);
                                  ttsReady = result != TextToSpeech.LANG_MISSING_DATA && result != TextToSpeech.LANG_NOT_SUPPORTED;
                              } catch (Exception e) {
                                  ttsReady = false;
                              }
                              if (ttsReady && pendingTts != null) {
                                  String text = pendingTts;
                                  pendingTts = null;
                                  try {
                                      tts.speak(text, TextToSpeech.QUEUE_FLUSH, null, "lynxos-coach");
                                  } catch (Exception ignored) {}
                              }
                          }
                      }
                  });
                  webView.addJavascriptInterface(new Object() {
                      @JavascriptInterface
                      public void speak(String text) {
                          if (text == null) return;
                          if (ttsReady && tts != null) {
                              try {
                                  tts.speak(text, TextToSpeech.QUEUE_FLUSH, null, "lynxos-coach");
                              } catch (Exception ignored) {}
                          } else {
                              pendingTts = text;
                          }
                      }
                      @JavascriptInterface
                      public void stop() {
                          pendingTts = null;
                          try {
                              if (tts != null) tts.stop();
                          } catch (Exception ignored) {}
                      }
                  }, "LynxosTts");
                  lynxosHealth = new LynxosHealth(this);
                  webView.addJavascriptInterface(lynxosHealth, "LynxosHealth");
                  webView.addJavascriptInterface(new Object() {
                      @JavascriptInterface
                      public void exitApp() {
                          try {
                              MainActivity.this.runOnUiThread(new Runnable() {
                                  @Override
                                  public void run() {
                                      try { MainActivity.this.finish(); } catch (Exception ignored) {}
                                  }
                              });
                          } catch (Exception ignored) {}
                      }
                  }, "LynxosBack");
                  webView.addJavascriptInterface(new Object() {
                      @JavascriptInterface
                      public void open(String url) {
                          try {
                              Intent intent = new Intent(Intent.ACTION_VIEW, Uri.parse(url));
                              intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                              startActivity(intent);
                          } catch (Exception ignored) {}
                      }
                  }, "LynxosOpen");
                  if (savedInstanceState != null) {
                      webView.restoreState(savedInstanceState);
                  } else {
                      webView.loadUrl("file:///android_asset/www/index.html");
                  }
                  setContentView(webView);
                  webView.requestFocus();
              }

              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  super.onActivityResult(requestCode, resultCode, data);
                  if (requestCode == LynxosHealth.REQUEST_CODE) {
                      try {
                          long secs = (System.currentTimeMillis() - LynxosHealth.Companion.getLastRequestTimeMs()) / 1000;
                          String dataInfo = (data == null) ? "no return data"
                              : "return extras=" + (data.getExtras() == null ? "none" : String.valueOf(data.getExtras().keySet()));
                          Toast.makeText(this, "Health Connect answered: result=" + resultCode + " after " + secs + " seconds. " + dataInfo, Toast.LENGTH_LONG).show();
                          webView.evaluateJavascript("window.dispatchEvent(new Event('lynxos-health-result'))", null);
                      } catch (Exception ignored) {}
                  }
                  if (requestCode == FILE_CHOOSER_REQUEST) {
                      Uri[] results = null;
                      if (resultCode == Activity.RESULT_OK && data != null && data.getData() != null) {
                          results = new Uri[] { data.getData() };
                      }
                      if (filePathCallback != null) {
                          filePathCallback.onReceiveValue(results);
                          filePathCallback = null;
                      }
                  }
              }

              private void handleAuthIntent(Intent intent) {
                  try {
                      if (intent == null || intent.getData() == null) return;
                      String d = intent.getDataString();
                      if (d != null && d.startsWith("com.workoutapp.app://auth-callback")) {
                          if (pageLoaded) {
                              deliverAuthUrl(d);
                          } else {
                              pendingAuthUrl = d;
                          }
                      }
                  } catch (Exception ignored) {}
              }

              private void deliverAuthUrl(final String url) {
                  try {
                      final String esc = url.replace("\\", "\\\\").replace("'", "\\'");
                      runOnUiThread(new Runnable() {
                          @Override
                          public void run() {
                              try {
                                  if (webView != null) {
                                      webView.evaluateJavascript("window.__handleAuthCallback('" + esc + "')", null);
                                  }
                              } catch (Exception ignored) {}
                          }
                      });
                  } catch (Exception ignored) {}
              }

              @Override
              protected void onNewIntent(Intent intent) {
                  super.onNewIntent(intent);
                  try { setIntent(intent); } catch (Exception ignored) {}
                  handleAuthIntent(intent);
              }

              @Override
              protected void onDestroy() {
                  if (tts != null) {
                      try {
                          tts.stop();
                          tts.shutdown();
                      } catch (Exception ignored) {}
                      tts = null;
                  }
                  super.onDestroy();
              }

              @Override
              protected void onSaveInstanceState(Bundle outState) {
                  super.onSaveInstanceState(outState);
                  if (webView != null) {
                      webView.saveState(outState);
                  }
              }

              private void defaultBackPressed() {
                  super.onBackPressed();
              }

              @Override
              public void onBackPressed() {
                  // Let the page handle back navigation first (dialogs, app sections).
                  // The page calls LynxosBack.exitApp() only when there is nowhere left to go.
                  if (webView == null) {
                      defaultBackPressed();
                      return;
                  }
                  try {
                      webView.evaluateJavascript(
                          "(function(){try{return (typeof window.__lynxosOnBack==='function')?'1':'0';}catch(e){return '0';}})()",
                          value -> {
                              try {
                                  if ("\"1\"".equals(value)) {
                                      webView.evaluateJavascript("window.__lynxosOnBack()", null);
                                  } else if (webView.canGoBack()) {
                                      webView.goBack();
                                  } else {
                                      MainActivity.this.defaultBackPressed();
                                  }
                              } catch (Exception ignored) {
                                  try { MainActivity.this.defaultBackPressed(); } catch (Exception ignored2) {}
                              }
                          });
                  } catch (Exception e) {
                      defaultBackPressed();
                  }
              }
          }
          EOF

          cat > app/src/main/java/com/workoutapp/app/LynxosHealth.kt <<'EOF'
          package com.workoutapp.app

          import android.app.Activity
          import android.content.Intent
          import android.net.Uri
          import android.os.Build
          import android.webkit.JavascriptInterface
          import android.widget.Toast
          import androidx.health.connect.client.HealthConnectClient
          import androidx.health.connect.client.PermissionController
          import androidx.health.connect.client.permission.HealthPermission
          import androidx.health.connect.client.records.ExerciseSessionRecord
          import androidx.health.connect.client.records.metadata.Device
          import androidx.health.connect.client.records.metadata.Metadata
          import kotlinx.coroutines.CoroutineScope
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.launch
          import kotlinx.coroutines.runBlocking
          import java.time.Instant

          class LynxosHealth(private val activity: Activity) {
              companion object {
                  const val REQUEST_CODE = 1002
                  var lastRequestTimeMs: Long = 0L
                  var lastIntentDiag: String = "not sent yet"
                  val PERMISSIONS: Set<String> = setOf(
                      HealthPermission.getReadPermission(ExerciseSessionRecord::class),
                      HealthPermission.getWritePermission(ExerciseSessionRecord::class)
                  )
                  val permissionContract = PermissionController.createRequestPermissionResultContract()
              }

              private val scope = CoroutineScope(Dispatchers.IO)
              private var client: HealthConnectClient? = null

              private fun toast(message: String) {
                  activity.runOnUiThread {
                      Toast.makeText(activity, message, Toast.LENGTH_LONG).show()
                  }
              }

              private fun getClient(): HealthConnectClient? {
                  client?.let { return it }
                  return try {
                      HealthConnectClient.getOrCreate(activity).also { client = it }
                  } catch (e: Exception) {
                      null
                  }
              }

              @JavascriptInterface
              fun status(): String {
                  return try {
                      when (HealthConnectClient.getSdkStatus(activity)) {
                          HealthConnectClient.SDK_AVAILABLE -> "available"
                          HealthConnectClient.SDK_UNAVAILABLE_PROVIDER_UPDATE_REQUIRED -> "needs_update"
                          else -> "unavailable"
                      }
                  } catch (e: Exception) {
                      "unavailable"
                  }
              }

              @JavascriptInterface
              fun diagnostics(): String {
                  return try {
                      val androidVer = "Android " + Build.VERSION.RELEASE + " (SDK " + Build.VERSION.SDK_INT + ")"
                      val hcVer = try {
                          val pi = activity.packageManager.getPackageInfo("com.google.android.apps.healthdata", 0)
                          "HC app " + pi.versionName + " code " + pi.versionCode
                      } catch (e: Exception) {
                          "HC app not found"
                      }
                      androidVer + ". " + hcVer + ". Last request: " + lastIntentDiag
                  } catch (e: Exception) {
                      "diagnostics failed"
                  }
              }

              @JavascriptInterface
              fun openHealthStore(): String {
                  return try {
                      val market = Intent(Intent.ACTION_VIEW, Uri.parse("market://details?id=com.google.android.apps.healthdata"))
                      activity.startActivity(market)
                      toast("Opening the Play Store...")
                      "opened-store"
                  } catch (e: Exception) {
                      try {
                          val web = Intent(Intent.ACTION_VIEW, Uri.parse("https://play.google.com/store/apps/details?id=com.google.android.apps.healthdata"))
                          activity.startActivity(web)
                          toast("Opening the Play Store in the browser...")
                          "opened-web"
                      } catch (e2: Exception) {
                          val msg = "Could not open the store: " + (e2.message ?: e2.javaClass.simpleName)
                          toast(msg)
                          "failed"
                      }
                  }
              }

              @JavascriptInterface
              fun hasPermissions(): Boolean {
                  return try {
                      val c = getClient() ?: return false
                      runBlocking { c.permissionController.getGrantedPermissions() }.containsAll(PERMISSIONS)
                  } catch (e: Exception) {
                      false
                  }
              }

              @JavascriptInterface
              fun getProviderDiagnostic(): String {
                  return try {
                      val pm = activity.packageManager
                      val sb = StringBuilder()
                      // 1. Get the FULL class name of DefaultGateway from the ResolveInfo.
                      val probeIntent = Intent("androidx.health.ACTION_REQUEST_PERMISSIONS").apply {
                          setPackage("com.google.android.apps.healthdata")
                      }
                      val matches = pm.queryIntentActivities(probeIntent, 0)
                      var fullName = ""
                      if (matches.isNotEmpty()) {
                          fullName = matches[0].activityInfo.name
                          sb.append("DefaultGateway full class: ").append(fullName)
                          // 2. Now get ActivityInfo with the CORRECT name.
                          try {
                              val cn = android.content.ComponentName(
                                  "com.google.android.apps.healthdata", fullName)
                              val ai = pm.getActivityInfo(cn, 0)
                              sb.append("\nExported=").append(ai.exported)
                              sb.append(" permission=").append(ai.permission ?: "none")
                              sb.append(" taskMode=").append(ai.launchMode)
                          } catch (e: Exception) {
                              sb.append("\nActivityInfo failed: ").append(e.javaClass.simpleName)
                          }
                      } else {
                          sb.append("No handler found for ACTION_REQUEST_PERMISSIONS")
                      }
                      // 3. Probe candidate actions (full names this time).
                      val actions = listOf(
                          "androidx.health.ACTION_REQUEST_PERMISSIONS",
                          "androidx.health.connect.client.HEALTH_PERMISSIONS",
                          "android.health.connect.action.REQUEST_HEALTH_PERMISSIONS",
                          "android.health.connect.action.MANAGE_HEALTH_PERMISSIONS",
                          "androidx.health.ACTION_SHOW_ONBOARDING"
                      )
                      for (action in actions) {
                          val intent = Intent(action).apply {
                              setPackage("com.google.android.apps.healthdata")
                          }
                          val m = pm.queryIntentActivities(intent, 0)
                          sb.append("\n").append(action.substringAfterLast('.'))
                              .append(" -> ")
                              .append(if (m.isEmpty()) "none" else m[0].activityInfo.name)
                      }
                      val result = sb.toString()
                      lastIntentDiag = result
                      toast(result)
                      result
                  } catch (e: Exception) {
                      val msg = "Diagnostic failed: " + (e.message ?: e.javaClass.simpleName)
                      toast(msg)
                      msg
                  }
              }

              @JavascriptInterface
              fun openHealthConnectApp(): String {
                  return try {
                      val pm = activity.packageManager
                      val launchIntent = pm.getLaunchIntentForPackage("com.google.android.apps.healthdata")
                      if (launchIntent != null) {
                          activity.runOnUiThread {
                              try {
                                  activity.startActivity(launchIntent)
                                  toast("Opening Health Connect app...")
                              } catch (e: Exception) {
                                  toast("Could not open HC app: " + (e.message ?: e.javaClass.simpleName))
                              }
                          }
                          "opened"
                      } else {
                          toast("Health Connect app has no launcher.")
                          "no-launcher"
                      }
                  } catch (e: Exception) {
                      val msg = "Failed: " + (e.message ?: e.javaClass.simpleName)
                      toast(msg)
                      "failed"
                  }
              }

              @JavascriptInterface
              fun tryPermissionVariants(): String {
                  return try {
                      if (HealthConnectClient.getSdkStatus(activity) != HealthConnectClient.SDK_AVAILABLE) {
                          toast("Health Connect is not available.")
                          return "not-available"
                      }
                      val base: Intent = permissionContract.createIntent(activity, PERMISSIONS)
                      // Variant 1: with NEW_TASK flag via startActivityForResult
                      val v1 = Intent(base).apply { addFlags(Intent.FLAG_ACTIVITY_NEW_TASK) }
                      // Variant 2: no proto extra, just action+package
                      val v2 = Intent("androidx.health.ACTION_REQUEST_PERMISSIONS").apply {
                          setPackage("com.google.android.apps.healthdata")
                      }
                      // We'll try v1 first, then v2. Report which was tried.
                      // For now, try v1 and toast the plan.
                      lastRequestTimeMs = System.currentTimeMillis()
                      activity.runOnUiThread {
                          try {
                              activity.startActivityForResult(v1, REQUEST_CODE)
                              toast("Trying variant with NEW_TASK flag...")
                          } catch (e: Exception) {
                              toast("Variant failed: " + (e.message ?: e.javaClass.simpleName))
                          }
                      }
                      "variant-sent"
                  } catch (e: Exception) {
                      val msg = "Variant failed: " + (e.message ?: e.javaClass.simpleName)
                      toast(msg)
                      "failed"
                  }
              }

              @JavascriptInterface
              fun requestPermissions(): String {
                  return try {
                      if (HealthConnectClient.getSdkStatus(activity) != HealthConnectClient.SDK_AVAILABLE) {
                          toast("Health Connect is not available on this phone.")
                          "not-available"
                      } else {
                          val explicitIntent: Intent = permissionContract.createIntent(activity, PERMISSIONS)
                          val pm = activity.packageManager
                          // Diagnostic: which components actually handle this intent?
                          val explicitMatches = pm.queryIntentActivities(explicitIntent, 0)
                          val implicitIntent = Intent(explicitIntent).apply { `package` = null }
                          val implicitMatches = pm.queryIntentActivities(implicitIntent, 0)
                          fun describe(list: List<android.content.pm.ResolveInfo>): String {
                              if (list.isEmpty()) return "none"
                              return list.joinToString(";") {
                                  it.activityInfo.packageName + "/" + it.activityInfo.name.substringAfterLast('.')
                              }
                          }
                          val diag = "HC handlers: with-package=" + describe(explicitMatches) +
                              ". Without-package=" + describe(implicitMatches)
                          lastIntentDiag = diag
                          toast(diag)
                          // Prefer the explicit provider target; fall back to implicit
                          // resolution if the provider package handles nothing.
                          val sendIntent = if (explicitMatches.isNotEmpty()) explicitIntent else implicitIntent
                          if (explicitMatches.isEmpty() && implicitMatches.isEmpty()) {
                              toast("No app on this phone can show the Health Connect permission screen.")
                              "no-handler"
                          } else {
                              lastRequestTimeMs = System.currentTimeMillis()
                              activity.runOnUiThread {
                                  try {
                                      activity.startActivityForResult(sendIntent, REQUEST_CODE)
                                      toast("Opening Health Connect...")
                                  } catch (e: Exception) {
                                      toast("Could not open Health Connect: " + (e.message ?: e.javaClass.simpleName))
                                  }
                              }
                              "launched"
                          }
                      }
                  } catch (e: Exception) {
                      val msg = "Permission request failed: " + (e.message ?: e.javaClass.simpleName)
                      toast(msg)
                      "failed"
                  }
              }

              @JavascriptInterface
              fun logWorkout(startEpochSec: Long, endEpochSec: Long, title: String?) {
                  try {
                      val c = getClient() ?: return
                      val start = Instant.ofEpochSecond(startEpochSec)
                      val end = Instant.ofEpochSecond(endEpochSec)
                      if (!start.isBefore(end)) return
                      val record = ExerciseSessionRecord(
                          startTime = start,
                          startZoneOffset = null,
                          endTime = end,
                          endZoneOffset = null,
                          metadata = Metadata.activelyRecorded(Device(type = Device.TYPE_PHONE)),
                          exerciseType = ExerciseSessionRecord.EXERCISE_TYPE_STRENGTH_TRAINING,
                          title = if (title.isNullOrBlank()) "Lynxos Gym workout" else title
                      )
                      scope.launch {
                          try {
                              c.insertRecords(listOf(record))
                          } catch (e: Exception) {
                          }
                      }
                  } catch (e: Exception) {
                  }
              }
          }
          EOF

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Build release APK (unsigned)
        run: gradle :app:assembleRelease

      - name: Sign release APK with the Lynxos key
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > /tmp/lynxos-release.p12
          "$APKSIGNER" sign --ks /tmp/lynxos-release.p12 --ks-type PKCS12 \
            --ks-pass "pass:${{ secrets.KEYSTORE_PASSWORD }}" \
            --key-pass "pass:${{ secrets.KEY_PASSWORD }}" \
            --ks-key-alias "${{ secrets.KEY_ALIAS }}" \
            --out app/build/outputs/apk/release/app-release.apk \
            app/build/outputs/apk/release/app-release-unsigned.apk
          rm -f /tmp/lynxos-release.p12
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk | head -3

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: workout-app-apk
          path: app/build/outputs/apk/release/app-release.apk

      - name: Publish GitHub release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION_NAME }}+${{ env.APP_VERSION_CODE }}
          name: v${{ env.APP_VERSION_NAME }}+${{ env.APP_VERSION_CODE }}
          body: ${{ env.APP_RELEASE_NOTES }}
          files: app/build/outputs/apk/release/app-release.apk
